name: Nexura Android motion polish (audio baseline)

on:
  push:
    branches:
      - feature/android-motion-polish-audio-base
    paths:
      - "app/**"
      - "crypto-core/**"
      - "crypto-jni/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android-motion-polish-audio-base.yml"
  pull_request:
    branches:
      - fix/v0.8.0-chat-and-audio-issues
    paths:
      - "app/**"
      - "crypto-core/**"
      - "crypto-jni/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android-motion-polish-audio-base.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Run native E2EE tests
        run: cargo test --manifest-path crypto-jni/Cargo.toml
      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked
      - name: Build native E2EE JNI libraries
        working-directory: crypto-jni
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release
      - name: Verify native libraries before packaging
        run: |
          set -euo pipefail
          test -s app/src/main/jniLibs/arm64-v8a/libnexura_e2ee_jni.so
          test -s app/src/main/jniLibs/armeabi-v7a/libnexura_e2ee_jni.so
          test -s app/src/main/jniLibs/x86_64/libnexura_e2ee_jni.so
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Run Android unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Verify packaged JNI libraries
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libnexura_e2ee_jni.so'
          unzip -l "$APK" | grep -F 'lib/armeabi-v7a/libnexura_e2ee_jni.so'
          unzip -l "$APK" | grep -F 'lib/x86_64/libnexura_e2ee_jni.so'
      - uses: actions/upload-artifact@v4
        with:
          name: nexura-motion-polish-audio-base-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
