name: Nexura E2EE Android build

on:
  push:
    branches: [ security/e2ee-phase-2, feature/voice-video-calls ]
    paths:
      - "app/**"
      - "crypto-core/**"
      - "crypto-jni/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/e2ee-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest branch build alive; several pushes can otherwise start
# simultaneous emulators and exhaust runner disk/RAM.
concurrency:
  group: nexura-e2ee-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked
      - name: Build native E2EE libraries
        working-directory: crypto-jni
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android debug APK with E2EE JNI
        run: gradle --no-daemon assembleDebug
      - name: Free disk space for Android AVD
        run: |
          echo "Disk usage before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          sudo docker image prune --all --force || true
          echo "Disk usage after cleanup:"
          df -h /
          AVAILABLE_KB=$(df -Pk / | awk 'NR==2 {print $4}')
          if [ "$AVAILABLE_KB" -lt 8388608 ]; then
            echo "::error::Less than 8 GiB free on runner; Android AVD cannot be created safely."
            exit 1
          fi
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Run E2EE instrumentation tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_atd
          profile: pixel_2
          # Use the emulator's software renderer; keep Android's audio flag valid.
          emulator-options: "-no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim"
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexura-e2ee-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
