name: Nexura 0.6.1 — media and voice transcription test APK
# Build verification for Android UX, account identity, and Compose animation updates.
on:
  push:
    branches: [ test/rebuild-v0.2.0-new, feature/pinned-jump-saved-messages-group-management, feature/android-usernames-contacts-reactions-pins, feature/media-reliability-transcription, feature/nexura-0.6.1-media-transcription, feature/nexura-profile-polish-2026-11, design/v0.8.0-interface-refresh ]
    paths:
      - "app/**"
      - "crypto-core/**"
      - "crypto-jni/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexura-media-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Run native E2EE cache tests
        run: cargo test --manifest-path crypto-jni/Cargo.toml
      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked
      - name: Build native E2EE JNI libraries
        working-directory: crypto-jni
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK for Nexura 0.6.1 media and transcription QA
        run: gradle --no-daemon assembleDebug
      - name: Verify native libraries are packaged
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86_64)/libnexura_e2ee_jni.so'
      - name: Upload clearly marked test APK
        uses: actions/upload-artifact@v4
        with:
          name: "NEXURA 0.6.1 — TEST APK"
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
