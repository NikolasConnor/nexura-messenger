services:
  transcription:
    build: .
    container_name: nexura-transcription
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 1200m
    cpus: 2.0
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
