name: Nexura Android motion polish

on:
  push:
    branches: [feature/android-motion-polish]
    paths:
      - "app/**"
      - "crypto-core/**"
      - "crypto-jni/**"
      - ".github/workflows/android-motion-check.yml"
  pull_request:
    branches: [release/android-text-v0.8.0]
    paths:
      - "app/**"
      - "crypto-core/**"
      - "crypto-jni/**"
      - ".github/workflows/android-motion-check.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nexura-android-motion-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
