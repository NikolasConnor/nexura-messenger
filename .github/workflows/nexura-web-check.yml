name: Nexura Web — build check

on:
  push:
    branches:
      - feature/nexura-profile-polish-2026-11
      - release/public-apk-site
    paths:
      - "web/**"
      - "crypto-wasm/**"
      - "services/transcription/**"
      - "supabase/functions/send-call-push/**"
      - ".github/workflows/nexura-web-check.yml"
  pull_request:
    paths:
      - "web/**"
      - "crypto-wasm/**"
      - "services/transcription/**"
      - "supabase/functions/send-call-push/**"
      - ".github/workflows/nexura-web-check.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build shared Olm WebAssembly module
        run: wasm-pack build crypto-wasm --target web --out-dir ../web/src/crypto/pkg

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund --no-package-lock --onnxruntime-node-install-cuda=skip

      - name: Test encrypted browser backup and recovery
        working-directory: web
        run: node --test src/crypto/backup.test.js src/api/social.test.js src/api/transcription.test.js

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check incoming call push Edge Function
        run: deno check supabase/functions/send-call-push/index.ts

      - name: Build Nexura Web
        working-directory: web
        run: npm run build
