name: Nexura Web build

on:
  push:
    branches:
      - "**"
    paths:
      - "web/**"
      - "crypto-core/**"
      - "crypto-wasm/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "crypto-core/**"
      - "crypto-wasm/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Set up wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
      - name: Build shared Olm WebAssembly module
        run: wasm-pack build crypto-wasm --target web --out-dir ../web/src/crypto/pkg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build web client
        working-directory: web
        run: npm run build -- --base=/nexura-messenger/app/
