name: Nexura 0.6.1 signed Android test APK

on:
  push:
    branches:
      - feature/nexura-0.6.1-media-transcription
    paths:
      - "app/**"
      - "crypto-core/**"
      - "crypto-jni/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/nexura-signed-test-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexura-signed-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Run native E2EE tests
        run: cargo test --manifest-path crypto-jni/Cargo.toml
      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build native E2EE libraries
        working-directory: crypto-jni
        run: |
          cargo install cargo-ndk --version 3.5.4 --locked
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile release APK and run unit tests
        run: |
          gradle --no-daemon :app:assembleRelease :app:testDebugUnitTest
      - name: Sign and verify with the existing Nexura release key
        env:
          NEXURA_KEYSTORE_BASE64: ${{ secrets.NEXURA_KEYSTORE_BASE64 }}
          NEXURA_KEYSTORE_PASSWORD: ${{ secrets.NEXURA_KEYSTORE_PASSWORD }}
          NEXURA_KEY_ALIAS: ${{ secrets.NEXURA_KEY_ALIAS }}
          NEXURA_KEY_PASSWORD: ${{ secrets.NEXURA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NEXURA_KEYSTORE_BASE64"
          test -n "$NEXURA_KEYSTORE_PASSWORD"
          test -n "$NEXURA_KEY_ALIAS"
          test -n "$NEXURA_KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/nexura-release.jks"
          printf '%s' "$NEXURA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/Nexura-aligned.apk"
          mkdir -p app/build/outputs/verified
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$NEXURA_KEY_ALIAS" \
            --ks-pass env:NEXURA_KEYSTORE_PASSWORD \
            --key-pass env:NEXURA_KEY_PASSWORD \
            --out app/build/outputs/verified/Nexura-0.6.1-telegram-auth.apk \
            "$RUNNER_TEMP/Nexura-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs app/build/outputs/verified/Nexura-0.6.1-telegram-auth.apk
          CERT_SHA256=$("$BUILD_TOOLS/apksigner" verify --print-certs app/build/outputs/verified/Nexura-0.6.1-telegram-auth.apk | awk '/Signer #1 certificate SHA-256 digest/ {print $NF}')
          test "$CERT_SHA256" = "303630584f922cf19bf77ba7e5044fc4bb968a9842dd53dcd9cac37571addca3"
          sha256sum app/build/outputs/verified/Nexura-0.6.1-telegram-auth.apk > app/build/outputs/verified/SHA256SUMS.txt
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexura-0.6.1-signed-telegram-auth
          path: |
            app/build/outputs/verified/Nexura-0.6.1-telegram-auth.apk
            app/build/outputs/verified/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
