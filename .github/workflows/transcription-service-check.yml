name: Nexura local transcription service check

on:
  pull_request:
    paths:
      - "services/transcription/**"
      - ".github/workflows/transcription-service-check.yml"
  push:
    branches:
      - release/public-apk-site
    paths:
      - "services/transcription/**"
      - ".github/workflows/transcription-service-check.yml"

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local Whisper service image
        run: docker build -t nexura-transcription-check ./services/transcription
      - name: Start service and check health endpoint
        run: |
          docker run -d --name nexura-transcription-check -p 127.0.0.1:8080:8080 nexura-transcription-check
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              docker logs nexura-transcription-check
              docker rm -f nexura-transcription-check
              exit 0
            fi
            sleep 2
          done
          docker logs nexura-transcription-check
          docker rm -f nexura-transcription-check
          exit 1
