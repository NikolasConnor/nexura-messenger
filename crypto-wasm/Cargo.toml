[package]
name = "nexura-crypto-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Browser WebAssembly adapter for Nexura's shared Olm protocol core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nexura-crypto-core = { path = "../crypto-core" }
wasm-bindgen = "=0.2.100"
serde-wasm-bindgen = "=0.6.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
js-sys = "=0.3.77"
getrandom = { version = "=0.4.3", features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
